name: build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build-ios:
    name: Build iOS Simulator + FFmpeg 9.0 version gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          XCODE_APP=$(ls /Applications | grep '^Xcode_.*\.app$' | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Resolve package (fully offline — FFmpeg 9.0 xcframeworks vendored in Sources/)
        run: swift package resolve

      - name: FFmpeg version gate (committed xcframeworks, 63/63/12)
        uses: ./.github/actions/ffmpeg-gate

      - name: Build iOS Simulator
        run: swift build --sdk `xcrun -sdk iphonesimulator -show-sdk-path` -Xswiftc -target -Xswiftc arm64-apple-ios26.0-simulator
