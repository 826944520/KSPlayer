name: build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build-ios:
    name: Build iOS Simulator + FFmpeg version gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          XCODE_APP=$(ls /Applications | grep '^Xcode_.*\.app$' | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Resolve package
        run: swift package resolve

      - name: FFmpeg version gate (header-level, resolved FFmpegKit checkout)
        run: |
          set -e
          # kingslay/FFmpegKit 6.1.4 is resolved under .build/checkouts/FFmpegKit.
          # version_major.h lives INSIDE the committed xcframework binary, so this
          # checks the actually-linked binary version, not the "n6.1.4" tag label.
          AVC_HDR=$(find .build/checkouts/FFmpegKit/Sources/Libavcodec.xcframework -name version_major.h -path '*ios-arm64*' 2>/dev/null | head -1)
          AVF_HDR=$(find .build/checkouts/FFmpegKit/Sources/Libavformat.xcframework -name version_major.h -path '*ios-arm64*' 2>/dev/null | head -1)
          AVFILTER_HDR=$(find .build/checkouts/FFmpegKit/Sources/Libavfilter.xcframework -name version_major.h -path '*ios-arm64*' 2>/dev/null | head -1)
          echo "avcodec header:   $AVC_HDR"
          echo "avformat header:  $AVF_HDR"
          echo "avfilter header:  $AVFILTER_HDR"
          if [ -z "$AVC_HDR" ] || [ -z "$AVF_HDR" ] || [ -z "$AVFILTER_HDR" ]; then
            echo "::error::version_major.h not found — FFmpegKit xcframeworks missing the ios-arm64 slice"
            exit 1
          fi
          AVC=$(grep -E '^#define LIBAVCODEC_VERSION_MAJOR' "$AVC_HDR" | grep -oE '[0-9]+' | head -1)
          AVF=$(grep -E '^#define LIBAVFORMAT_VERSION_MAJOR' "$AVF_HDR" | grep -oE '[0-9]+' | head -1)
          AVFILTER=$(grep -E '^#define LIBAVFILTER_VERSION_MAJOR' "$AVFILTER_HDR" | grep -oE '[0-9]+' | head -1)
          echo "LIBAVCODEC_VERSION_MAJOR=$AVC  (expect 60)"
          echo "LIBAVFORMAT_VERSION_MAJOR=$AVF  (expect 60)"
          echo "LIBAVFILTER_VERSION_MAJOR=$AVFILTER  (expect 9)"
          [ "$AVC" = "60" ] || { echo "::error::FFmpeg avcodec major != 60 (got $AVC)"; exit 1; }
          [ "$AVF" = "60" ] || { echo "::error::FFmpeg avformat major != 60 (got $AVF)"; exit 1; }
          [ "$AVFILTER" = "9" ] || { echo "::error::FFmpeg avfilter major != 9 (got $AVFILTER)"; exit 1; }

      - name: Build iOS Simulator
        run: |
          set -o pipefail
          if ! swift build --sdk `xcrun -sdk iphonesimulator -show-sdk-path` \
            -Xswiftc -target -Xswiftc arm64-apple-ios26.0-simulator 2>&1 | tee /tmp/build.log; then
            echo "::error::=== swift build FAILED — last error lines ==="
            grep -nE "error:" /tmp/build.log | tail -5 | sed 's/^/::error::/'
            echo "::error::=== last 20 log lines ==="
            tail -20 /tmp/build.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Upload build log (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-log
          path: /tmp/build.log

  build-ipa:
    name: Build unsigned IPA (demo app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          XCODE_APP=$(ls /Applications | grep '^Xcode_.*\.app$' | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version

      - name: Generate Xcode project
        working-directory: Demo
        run: xcodegen generate

      - name: Build demo app (unsigned, iphoneos)
        working-directory: Demo
        run: |
          xcodebuild -project DemoApp.xcodeproj \
            -scheme DemoApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        working-directory: Demo
        run: |
          set -e
          APP=$(ls build/Build/Products/Release-iphoneos/DemoApp.app >/dev/null 2>&1 && echo build/Build/Products/Release-iphoneos/DemoApp.app || find build -name 'DemoApp.app' -type d | head -1)
          if [ -z "$APP" ]; then echo "::error::DemoApp.app not found"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DemoApp-unsigned.ipa Payload
          ls -lh DemoApp-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemoApp-unsigned-ipa
          path: Demo/DemoApp-unsigned.ipa
