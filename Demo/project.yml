name: DemoApp
options:
  minimumXcodeGenVersion: "2.38.0"
  deploymentTarget:
    iOS: "26.0"
packages:
  KSPlayer:
    path: ..
targets:
  DemoApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - DemoApp
    dependencies:
      - package: KSPlayer
    info:
      path: DemoApp/Info.plist
      properties:
        CFBundleDisplayName: KSPlayer Demo
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Remote logging to http://192.168.10.15:7777 (LAN HTTP + local
        # network permission). ATS: the Demo target ships Info.plist in-repo
        # so NSAppTransportSecurity is applied project-wide.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: KSPlayer Demo uploads playback logs to the local log server (192.168.10.15:7777) for debugging.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingsplayer.DemoApp
        PRODUCT_NAME: DemoApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos"
        SUPPORTS_MACCATALYST: NO
schemes:
  DemoApp:
    build:
      targets:
        DemoApp: all
    run:
      config: Debug
    archive:
      config: Release
